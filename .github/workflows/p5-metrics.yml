name: P5 metrics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: make metrics test-p5-metrics
      - name: Verify committed derived evidence is reproducible
        run: git diff --exit-code -- evidence/metrics/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-metrics
          path: |
            results/p4_*summary.csv
            results/p4_comparison_test.log
            evidence/metrics/
