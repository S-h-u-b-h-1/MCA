<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
<title id="title">Direction accuracy on identical branch traces</title>
<desc id="desc">Percent correct for always not taken, 1-bit and 2-bit predictors. Overall is weighted by dynamic branch count.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" font-size="14" fill="#172733">
<text x="25" y="28" font-size="21">Direction accuracy on identical branch traces</text>
<text x="25" y="51">Synthetic traces; 16 entries; prediction before update; overall weighted by branch count</text>
<rect x="25" y="68" width="14" height="14" fill="#596579"/>
<text x="45" y="80">Always NT</text>
<rect x="205" y="68" width="14" height="14" fill="#d48018"/>
<text x="225" y="80">1-bit</text>
<rect x="385" y="68" width="14" height="14" fill="#167a93"/>
<text x="405" y="80">2-bit</text>
<text x="25" y="112">Loop-dominated (TTTTN)</text>
<text x="25" y="133" fill="#596579">n = 40</text>
<line x1="320" x2="320" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="320" y="203" text-anchor="middle" font-size="11">0%</text>
<line x1="440" x2="440" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="440" y="203" text-anchor="middle" font-size="11">20%</text>
<line x1="560" x2="560" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="560" y="203" text-anchor="middle" font-size="11">40%</text>
<line x1="680" x2="680" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="680" y="203" text-anchor="middle" font-size="11">60%</text>
<line x1="800" x2="800" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="800" y="203" text-anchor="middle" font-size="11">80%</text>
<line x1="920" x2="920" y1="100" y2="184" stroke="#e5e9ed"/>
<text x="920" y="203" text-anchor="middle" font-size="11">100%</text>
<rect x="320" y="102" width="120.000" height="19" fill="#596579"><title>Always NT: 20.00%</title></rect>
<text x="448.000" y="117">20.00%</text>
<rect x="320" y="129" width="360.000" height="19" fill="#d48018"><title>1-bit: 60.00%</title></rect>
<text x="688.000" y="144">60.00%</text>
<rect x="320" y="156" width="465.000" height="19" fill="#167a93"><title>2-bit: 77.50%</title></rect>
<text x="793.000" y="171">77.50%</text>
<text x="25" y="237">Strict Alternating (TNTN)</text>
<text x="25" y="258" fill="#596579">n = 40</text>
<line x1="320" x2="320" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="320" y="328" text-anchor="middle" font-size="11">0%</text>
<line x1="440" x2="440" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="440" y="328" text-anchor="middle" font-size="11">20%</text>
<line x1="560" x2="560" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="560" y="328" text-anchor="middle" font-size="11">40%</text>
<line x1="680" x2="680" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="680" y="328" text-anchor="middle" font-size="11">60%</text>
<line x1="800" x2="800" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="800" y="328" text-anchor="middle" font-size="11">80%</text>
<line x1="920" x2="920" y1="225" y2="309" stroke="#e5e9ed"/>
<text x="920" y="328" text-anchor="middle" font-size="11">100%</text>
<rect x="320" y="227" width="300.000" height="19" fill="#596579"><title>Always NT: 50.00%</title></rect>
<text x="628.000" y="242">50.00%</text>
<rect x="320" y="254" width="0.000" height="19" fill="#d48018"><title>1-bit: 0.00%</title></rect>
<text x="328.000" y="269">0.00%</text>
<rect x="320" y="281" width="0.000" height="19" fill="#167a93"><title>2-bit: 0.00%</title></rect>
<text x="328.000" y="296">0.00%</text>
<text x="25" y="362">Mixed BEQ/BNE Aliased</text>
<text x="25" y="383" fill="#596579">n = 50</text>
<line x1="320" x2="320" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="320" y="453" text-anchor="middle" font-size="11">0%</text>
<line x1="440" x2="440" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="440" y="453" text-anchor="middle" font-size="11">20%</text>
<line x1="560" x2="560" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="560" y="453" text-anchor="middle" font-size="11">40%</text>
<line x1="680" x2="680" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="680" y="453" text-anchor="middle" font-size="11">60%</text>
<line x1="800" x2="800" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="800" y="453" text-anchor="middle" font-size="11">80%</text>
<line x1="920" x2="920" y1="350" y2="434" stroke="#e5e9ed"/>
<text x="920" y="453" text-anchor="middle" font-size="11">100%</text>
<rect x="320" y="352" width="240.000" height="19" fill="#596579"><title>Always NT: 40.00%</title></rect>
<text x="568.000" y="367">40.00%</text>
<rect x="320" y="379" width="276.000" height="19" fill="#d48018"><title>1-bit: 46.00%</title></rect>
<text x="604.000" y="394">46.00%</text>
<rect x="320" y="406" width="288.000" height="19" fill="#167a93"><title>2-bit: 48.00%</title></rect>
<text x="616.000" y="421">48.00%</text>
<text x="25" y="487">Consolidated Overall</text>
<text x="25" y="508" fill="#596579">n = 130</text>
<line x1="320" x2="320" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="320" y="578" text-anchor="middle" font-size="11">0%</text>
<line x1="440" x2="440" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="440" y="578" text-anchor="middle" font-size="11">20%</text>
<line x1="560" x2="560" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="560" y="578" text-anchor="middle" font-size="11">40%</text>
<line x1="680" x2="680" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="680" y="578" text-anchor="middle" font-size="11">60%</text>
<line x1="800" x2="800" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="800" y="578" text-anchor="middle" font-size="11">80%</text>
<line x1="920" x2="920" y1="475" y2="559" stroke="#e5e9ed"/>
<text x="920" y="578" text-anchor="middle" font-size="11">100%</text>
<rect x="320" y="477" width="221.538" height="19" fill="#596579"><title>Always NT: 36.92%</title></rect>
<text x="549.538" y="492">36.92%</text>
<rect x="320" y="504" width="216.923" height="19" fill="#d48018"><title>1-bit: 36.15%</title></rect>
<text x="544.923" y="519">36.15%</text>
<rect x="320" y="531" width="253.846" height="19" fill="#167a93"><title>2-bit: 42.31%</title></rect>
<text x="581.846" y="546">42.31%</text>
</g></svg>
